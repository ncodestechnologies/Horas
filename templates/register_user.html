{% extends "base.html" %}

{% block title %}Criar Conta Pessoal{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card" style="max-width: 480px; width: 100%;">
    <!-- Cabeçalho da Tela Inicial de Cadastro -->
    <div class="login-brand" style="margin-bottom: 1.5rem;">
      <div class="login-brand-icon" style="background: linear-gradient(135deg, #1e3a8a, #2563eb);">⏱</div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.25rem;">
        Criar Sua Conta
      </h1>
      <p style="font-size: 0.92rem; color: var(--text-muted);">
        Meu Controle de Horas — Gestão inteligente de ponto e banco de horas
      </p>
    </div>

    <!-- Formulário de Cadastro Pessoal -->
    <form method="POST" action="{{ url_for('register_user') }}" id="form-register" onsubmit="return validateFormBeforeSubmit(event)">
      <!-- Mensagem de Erro Inline do Formulário -->
      <div id="reg-form-error" style="display: none; padding: 10px 14px; border-radius: 8px; background: #fef2f2; border: 1px solid #fecdd3; color: #991b1b; font-size: 0.88rem; margin-bottom: 1.25rem;"></div>

      <!-- Nome Completo -->
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="reg-name" class="form-label" style="font-weight: 600;">Nome Completo</label>
        <input 
          type="text" 
          id="reg-name" 
          name="name" 
          class="form-control" 
          required 
          value="{{ name or '' }}"
          placeholder="Ex: João da Silva"
          autocomplete="name"
        >
      </div>

      <!-- E-mail -->
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="reg-email" class="form-label" style="font-weight: 600;">E-mail</label>
        <input 
          type="email" 
          id="reg-email" 
          name="email" 
          class="form-control" 
          required 
          value="{{ email or '' }}"
          placeholder="seu-email@exemplo.com"
          autocomplete="email"
        >
      </div>

      <!-- CPF com Validador em Tempo Real -->
      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label for="reg-cpf" class="form-label" style="font-weight: 600; display: flex; justify-content: space-between; align-items: center;">
          <span>CPF (Opcional — com Validação)</span>
          <span id="cpf-counter" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 400;">0/11 dígitos</span>
        </label>
        
        <div style="position: relative;">
          <input 
            type="text" 
            id="reg-cpf" 
            name="cpf" 
            class="form-control" 
            maxlength="14"
            value="{{ cpf or '' }}"
            placeholder="000.000.000-00 (Opcional)"
            autocomplete="off"
            style="font-family: monospace; font-size: 0.98rem; letter-spacing: 0.05em;"
            oninput="handleCPFInput(this)"
            onblur="checkCPFValidation(this)"
          >
          <span id="cpf-status-icon" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; pointer-events: none;"></span>
        </div>

        <!-- Feedback Visual do Validador de CPF -->
        <div id="cpf-feedback" style="margin-top: 6px; font-size: 0.82rem; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b;">
          <span id="cpf-feedback-icon">ℹ️</span>
          <span id="cpf-feedback-text">Digite os 11 dígitos para validação oficial do CPF</span>
        </div>
      </div>

      <!-- Senha e Confirmação -->
      <div class="form-row" style="margin-bottom: 1.25rem;">
        <div class="form-group" style="flex: 1;">
          <label for="reg-password" class="form-label" style="font-weight: 600;">Senha</label>
          <input 
            type="password" 
            id="reg-password" 
            name="password" 
            class="form-control" 
            required 
            placeholder="Mínimo 4 caracteres"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group" style="flex: 1;">
          <label for="reg-confirm-password" class="form-label" style="font-weight: 600;">Confirmar Senha</label>
          <input 
            type="password" 
            id="reg-confirm-password" 
            name="confirm_password" 
            class="form-control" 
            required 
            placeholder="Repita a senha"
            autocomplete="new-password"
          >
        </div>
      </div>

      <!-- Botões de Ação -->
      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <button type="submit" class="btn btn-primary" id="btn-create-account" style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 700;">
          ✓ Criar Minha Conta e Acessar
        </button>

        <a href="{{ url_for('login') }}" class="btn btn-secondary" id="btn-go-to-login" style="width: 100%; text-align: center;">
          Já tem conta? Fazer Login
        </a>
      </div>
    </form>
  </div>
</div>

<!-- Scripts de Validação de CPF e Formatação -->
<script>
  // ==========================================
  // VALIDADOR DE CPF (Algoritmo Oficial Módulo 11)
  // ==========================================

  function isValidCPF(cpfStr) {
    if (!cpfStr) return false;
    // Remove qualquer caractere que não seja número
    var clean = cpfStr.replace(/\D/g, '');
    if (clean.length !== 11) return false;

    // Rejeita sequências com todos os dígitos iguais (ex: 111.111.111-11)
    if (/^(\d)\1{10}$/.test(clean)) return false;

    // Cálculo do 1º dígito verificador
    var sum1 = 0;
    for (var i = 0; i < 9; i++) {
      sum1 += parseInt(clean.charAt(i), 10) * (10 - i);
    }
    var remainder1 = 11 - (sum1 % 11);
    var d1 = (remainder1 >= 10) ? 0 : remainder1;
    if (d1 !== parseInt(clean.charAt(9), 10)) return false;

    // Cálculo do 2º dígito verificador
    var sum2 = 0;
    for (var j = 0; j < 10; j++) {
      sum2 += parseInt(clean.charAt(j), 10) * (11 - j);
    }
    var remainder2 = 11 - (sum2 % 11);
    var d2 = (remainder2 >= 10) ? 0 : remainder2;
    if (d2 !== parseInt(clean.charAt(10), 10)) return false;

    return true;
  }

  function formatCPFValue(val) {
    var digits = val.replace(/\D/g, '').slice(0, 11);
    if (digits.length <= 3) return digits;
    if (digits.length <= 6) return digits.replace(/(\d{3})(\d)/, '$1.$2');
    if (digits.length <= 9) return digits.replace(/(\d{3})(\d{3})(\d)/, '$1.$2.$3');
    return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  }

  function handleCPFInput(input) {
    var raw = input.value;
    var digitsOnly = raw.replace(/\D/g, '').slice(0, 11);
    input.value = formatCPFValue(raw);

    var counter = document.getElementById('cpf-counter');
    if (counter) counter.innerText = digitsOnly.length + '/11 dígitos';

    updateCPFFeedback(input.value, digitsOnly);
  }

  function updateCPFFeedback(formatted, digits) {
    var feedbackBox = document.getElementById('cpf-feedback');
    var feedbackText = document.getElementById('cpf-feedback-text');
    var feedbackIcon = document.getElementById('cpf-feedback-icon');
    var statusIcon = document.getElementById('cpf-status-icon');
    var input = document.getElementById('reg-cpf');

    if (!digits || digits.length === 0) {
      feedbackBox.style.background = '#f8fafc';
      feedbackBox.style.borderColor = '#e2e8f0';
      feedbackBox.style.color = '#64748b';
      feedbackIcon.innerText = 'ℹ️';
      feedbackText.innerText = 'Digite os 11 dígitos para validação oficial do CPF';
      statusIcon.innerText = '';
      input.style.borderColor = '#e2e8f0';
      return;
    }

    if (digits.length < 11) {
      feedbackBox.style.background = '#eff6ff';
      feedbackBox.style.borderColor = '#bfdbfe';
      feedbackBox.style.color = '#1e40af';
      feedbackIcon.innerText = '⏳';
      feedbackText.innerText = 'Digitando CPF (' + digits.length + ' de 11 dígitos)...';
      statusIcon.innerText = '';
      input.style.borderColor = '#93c5fd';
      return;
    }

    // 11 dígitos preenchidos: validação oficial
    if (isValidCPF(digits)) {
      feedbackBox.style.background = '#ecfdf5';
      feedbackBox.style.borderColor = '#a7f3d0';
      feedbackBox.style.color = '#065f46';
      feedbackIcon.innerText = '✅';
      feedbackText.innerHTML = '<strong>CPF autêntico e válido!</strong> Cálculo de dígitos aprovado.';
      statusIcon.innerText = '✅';
      input.style.borderColor = '#10b981';
      input.style.backgroundColor = '#f0fdf4';
    } else {
      feedbackBox.style.background = '#fff1f2';
      feedbackBox.style.borderColor = '#fecdd3';
      feedbackBox.style.color = '#9f1239';
      feedbackIcon.innerText = '❌';
      feedbackText.innerHTML = '<strong>CPF inválido!</strong> Os dígitos verificadores não conferem com o cálculo da Receita Federal.';
      statusIcon.innerText = '❌';
      input.style.borderColor = '#ef4444';
      input.style.backgroundColor = '#fef2f2';
    }
  }

  function checkCPFValidation(input) {
    var digits = input.value.replace(/\D/g, '');
    updateCPFFeedback(input.value, digits);
  }

  function validateFormBeforeSubmit(e) {
    var errorBox = document.getElementById('reg-form-error');
    if (errorBox) {
      errorBox.style.display = 'none';
      errorBox.innerText = '';
    }

    var pwd = (document.getElementById('reg-password').value || '');
    var conf = (document.getElementById('reg-confirm-password').value || '');

    if (pwd.length < 4) {
      if (errorBox) {
        errorBox.innerText = 'A senha deve conter pelo menos 4 caracteres.';
        errorBox.style.display = 'block';
        errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return false;
    }

    if (pwd !== conf) {
      if (errorBox) {
        errorBox.innerText = 'A confirmação de senha não coincide com a senha digitada.';
        errorBox.style.display = 'block';
        errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return false;
    }

    var cpfInput = document.getElementById('reg-cpf');
    var digits = (cpfInput.value || '').replace(/\D/g, '');

    // Se digitou CPF incompleto (entre 1 e 10 dígitos)
    if (digits.length > 0 && digits.length < 11) {
      if (errorBox) {
        errorBox.innerText = 'Por favor, complete os 11 dígitos do seu CPF ou deixe o campo em branco se não desejar cadastrá-lo agora.';
        errorBox.style.display = 'block';
        errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      cpfInput.focus();
      return false;
    }

    return true;
  }

  // Inicializa feedback se o campo já vier preenchido
  document.addEventListener('DOMContentLoaded', function() {
    var cpfInput = document.getElementById('reg-cpf');
    if (cpfInput && cpfInput.value) {
      handleCPFInput(cpfInput);
    }
  });
</script>
{% endblock %}
