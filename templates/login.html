{% extends "base.html" %}

{% block title %}Entrar no Sistema{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card" style="max-width: 440px; width: 100%;">
    <!-- Cabeçalho -->
    <div class="login-brand" style="margin-bottom: 1.5rem;">
      <div class="login-brand-icon" style="background: linear-gradient(135deg, #1e3a8a, #2563eb);">⏱</div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.25rem;">
        Acesso ao Sistema
      </h1>
      <p style="font-size: 0.92rem; color: var(--text-muted);">
        Meu Controle de Horas — Sistema Pessoal
      </p>
    </div>

    <!-- Formulário Padrão de Login -->
    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="email" class="form-label" style="font-weight: 600;">E-mail</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          required 
          value="{{ request.form.get('email', '') }}"
          placeholder="seu-email@exemplo.com"
          autocomplete="off"
          autofocus
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="password" class="form-label" style="font-weight: 600;">Senha</label>
        <div style="position: relative;">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            required 
            value=""
            placeholder="Sua senha de acesso"
            autocomplete="current-password"
            style="padding-right: 2.75rem;"
          >
          <button 
            type="button" 
            id="btn-toggle-password" 
            onclick="togglePasswordVisibility()" 
            title="Mostrar/Ocultar Senha"
            style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 4px 6px;"
          >
            👁️
          </button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <button type="submit" class="btn btn-primary" id="btn-login" style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 700;">
          Entrar no Sistema
        </button>

        <a href="{{ url_for('register_user') }}" class="btn btn-secondary" id="btn-goto-signup" style="width: 100%; text-align: center;">
          ➕ Não tem conta? Criar Nova Conta
        </a>
      </div>
    </form>

    <div class="login-footer" style="margin-top: 1.25rem;">
      <a href="{{ url_for('recover_password') }}" id="link-recover">Esqueceu sua senha? Recuperar senha</a>
    </div>
  </div>
</div>

<script>
{% if request.args.get('force') %}
try {
  sessionStorage.removeItem('horas_auth_token');
  localStorage.removeItem('horas_auth_token');
} catch(e) {}
{% endif %}

function togglePasswordVisibility() {
  const pwdInput = document.getElementById('password');
  const btn = document.getElementById('btn-toggle-password');
  if (pwdInput) {
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      if (btn) btn.textContent = '🔒';
    } else {
      pwdInput.type = 'password';
      if (btn) btn.textContent = '👁️';
    }
  }
}
</script>
{% endblock %}
